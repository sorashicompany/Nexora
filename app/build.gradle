plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.music'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.nexora.music'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '1.7.0'
        buildConfigField 'String', 'SUPABASE_URL', '"https://xvmcsqpfcabhblaweaix.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_BRUOkhD4ZFOQyLm5y0-HQg_LoDVyMND"'
        buildConfigField 'String', 'NEXORA_API_URL', '"https://nexora-api.sorashithegod.workers.dev"'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep legacy source preparation deterministic for the current prototype while applying only small,
// idempotent UI migrations. New features should be committed to Java directly as the codebase is split.
tasks.register('prepareNexora170') {
    doLast {
        def source = file('src/main/java/com/nexora/music/MainActivity.java')
        def text = source.getText('UTF-8')
        text = text.replace('v1.4.1', 'v1.7.0').replace('v1.5.0', 'v1.7.0').replace('v1.5.1', 'v1.7.0').replace('v1.6.0', 'v1.7.0')

        def oldNav = '''    private LinearLayout buildNav(int selected){LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(6),dp(5),dp(6),dp(5));n.setBackground(round(SURFACE,26));n.addView(navItem("Поиск",R.drawable.ic_search,selected==-2,v->showSearch()),weight());n.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());n.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());n.addView(navItem("Музыка",android.R.drawable.btn_star_big_on,selected==4,v->showLikedMusic()),weight());n.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());n.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());return n;}'''
        def newNav = '''    private LinearLayout buildNav(int selected){LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(8),dp(5),dp(8),dp(5));n.setBackground(round(SURFACE,26));n.addView(navItem("Поиск",R.drawable.ic_search,selected==-2,v->showSearch()),weight());n.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());n.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());n.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());n.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());return n;}'''
        if (text.contains(oldNav)) text = text.replace(oldNav, newNav)

        if (!text.contains('private void showLikedMusic(){')) {
            def marker = '    private void showChats(){'
            def liked = '''    private void showLikedMusic(){shell("Понравившееся",-1);TextView intro=txt("Твоя музыка",13,MUTED,false);content.addView(intro);LinearLayout list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);content.addView(list);String raw=getPreferences(MODE_PRIVATE).getString("liked_music_json","[]");try{JsonArray a=JsonParser.parseString(raw).getAsJsonArray();if(a.size()==0){list.addView(empty("Здесь пока пусто","Нажимай сердце на треках, которые хочешь сохранить."));}else for(JsonElement e:a)list.addView(trackCard(e.getAsJsonObject(),false));}catch(Exception e){list.addView(empty("Не удалось открыть музыку","Попробуй ещё раз."));}}\n    private boolean isLiked(JsonObject t){String id=val(t,"id"),url=val(t,"audio_url");try{for(JsonElement e:JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("liked_music_json","[]")).getAsJsonArray()){JsonObject x=e.getAsJsonObject();if((!id.isEmpty()&&id.equals(val(x,"id")))||(!url.isEmpty()&&url.equals(val(x,"audio_url"))))return true;}}catch(Exception ignored){}return false;}\n    private void toggleLiked(JsonObject t){try{JsonArray a=JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("liked_music_json","[]")).getAsJsonArray();String id=val(t,"id"),url=val(t,"audio_url");int found=-1;for(int i=0;i<a.size();i++){JsonObject x=a.get(i).getAsJsonObject();if((!id.isEmpty()&&id.equals(val(x,"id")))||(!url.isEmpty()&&url.equals(val(x,"audio_url")))){found=i;break;}}if(found>=0){a.remove(found);toast("Убрано из понравившегося");}else{a.add(t.deepCopy());toast("Добавлено в понравившееся");}getPreferences(MODE_PRIVATE).edit().putString("liked_music_json",a.toString()).apply();}catch(Exception e){toast("Не удалось изменить понравившееся");}}\n'''
            text = text.replace(marker, liked + marker)
        }

        if (!text.contains('private View likedMusicProfileCard(){')) {
            def marker = '    private void renderProfile(JsonObject p,boolean own,String profileId){'
            def helper = '''    private View likedMusicProfileCard(){LinearLayout r=card();r.setOrientation(LinearLayout.VERTICAL);r.setPadding(dp(15),dp(13),dp(15),dp(13));LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);ImageView heart=icon(R.drawable.ic_heart,CYAN);heart.setBackground(round(SURFACE2,16));top.addView(heart,new LinearLayout.LayoutParams(dp(46),dp(46)));LinearLayout copy=new LinearLayout(this);copy.setOrientation(LinearLayout.VERTICAL);copy.setPadding(dp(12),0,dp(8),0);copy.addView(txt("Понравившаяся музыка",15,TEXT,true));int count=0;try{count=JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("liked_music_json","[]")).getAsJsonArray().size();}catch(Exception ignored){}copy.addView(txt(count==0?"Сохраняй любимые треки одним нажатием":count+" сохранённых композиций",11,MUTED,false));top.addView(copy,new LinearLayout.LayoutParams(0,-2,1));top.addView(txt("›",25,MUTED,true),new LinearLayout.LayoutParams(dp(32),dp(46)));r.addView(top);r.setOnClickListener(v->showLikedMusic());r.setOnTouchListener((v,e)->{if(e.getAction()==MotionEvent.ACTION_DOWN)v.animate().scaleX(.985f).scaleY(.985f).setDuration(70).start();else if(e.getAction()==MotionEvent.ACTION_UP)v.animate().scaleX(1).scaleY(1).setDuration(120).start();return false;});return r;}\n'''
            text = text.replace(marker, helper + marker)
        }

        def profileAnchor = 'content.addView(hero);stats(profileId);section("Сервисы");loadServices(profileId);section("Треки");loadTracks(profileId,own,"track");section("Биты");loadTracks(profileId,own,"beat");section("Посты");loadPosts(profileId);}'
        def profileReplacement = 'content.addView(hero);stats(profileId);section("Сервисы");loadServices(profileId);section("Музыка");content.addView(likedMusicProfileCard());section("Треки");loadTracks(profileId,own,"track");section("Биты");loadTracks(profileId,own,"beat");section("Посты");loadPosts(profileId);}'
        if (text.contains(profileAnchor)) text = text.replace(profileAnchor, profileReplacement)

        def oldTrack = '''    private View trackCard(JsonObject t,boolean own){LinearLayout r=card();r.setPadding(dp(10),dp(10),dp(8),dp(10));ImageView play=icon(android.R.drawable.ic_media_play,CYAN);play.setBackground(round(SURFACE2,22));r.addView(play,new LinearLayout.LayoutParams(dp(46),dp(46)));LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(12),0,dp(8),0);c.addView(txt(val(t,"title"),15,TEXT,true));String meta=val(t,"genre");if(meta.isEmpty())meta="Без жанра";if("beat".equals(val(t,"kind"))){if(t.has("bpm"))meta+=" • "+val(t,"bpm")+" BPM";if(!val(t,"key_signature").isEmpty())meta+=" • "+val(t,"key_signature");if(!val(t,"detune").isEmpty())meta+=" • detune "+val(t,"detune");}else meta+=" • Трек";c.addView(txt(meta,11,MUTED,false));c.addView(wave());r.addView(c,new LinearLayout.LayoutParams(0,-2,1));play.setOnClickListener(v->playTrack(t));if(own){ImageView del=icon(R.drawable.ic_close,RED);del.setOnClickListener(v->confirmDeleteTrack(t));r.addView(del,new LinearLayout.LayoutParams(dp(42),dp(42)));}margin(r,0,0,0,8);return r;}'''
        def newTrack = '''    private View trackCard(JsonObject t,boolean own){LinearLayout r=card();r.setPadding(dp(10),dp(10),dp(8),dp(10));ImageView play=icon(R.drawable.ic_play,CYAN);play.setBackground(round(SURFACE2,22));r.addView(play,new LinearLayout.LayoutParams(dp(46),dp(46)));LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(12),0,dp(8),0);c.addView(txt(val(t,"title"),15,TEXT,true));String meta=val(t,"genre");if(meta.isEmpty())meta="Без жанра";if("beat".equals(val(t,"kind"))){if(t.has("bpm"))meta+=" • "+val(t,"bpm")+" BPM";if(!val(t,"key_signature").isEmpty())meta+=" • "+val(t,"key_signature");if(!val(t,"detune").isEmpty())meta+=" • detune "+val(t,"detune");}else meta+=" • Трек";c.addView(txt(meta,11,MUTED,false));c.addView(wave());r.addView(c,new LinearLayout.LayoutParams(0,-2,1));ImageView like=icon(R.drawable.ic_heart,isLiked(t)?CYAN:MUTED);like.setOnClickListener(v->{toggleLiked(t);like.setColorFilter(isLiked(t)?CYAN:MUTED);v.animate().scaleX(.82f).scaleY(.82f).setDuration(70).withEndAction(()->v.animate().scaleX(1).scaleY(1).setDuration(110).start()).start();});r.addView(like,new LinearLayout.LayoutParams(dp(42),dp(42)));play.setOnClickListener(v->playTrack(t));if(own){ImageView del=icon(R.drawable.ic_close,RED);del.setOnClickListener(v->confirmDeleteTrack(t));r.addView(del,new LinearLayout.LayoutParams(dp(42),dp(42)));}margin(r,0,0,0,8);return r;}'''
        if (text.contains(oldTrack)) text = text.replace(oldTrack, newTrack)

        if (!text.contains('private View postComposer(){')) {
            def marker = '    private void loadPosts(String id){'
            def helpers = '''    private View postComposer(){LinearLayout box=card();box.setPadding(dp(6),dp(6),dp(6),dp(6));EditText e=input("Напиши пост… #tag");ImageView send=icon(R.drawable.ic_send,CYAN);send.setBackground(round(CYAN,22));send.setPadding(dp(11),dp(11),dp(11),dp(11));box.addView(e,new LinearLayout.LayoutParams(0,dp(52),1));box.addView(send,new LinearLayout.LayoutParams(dp(52),dp(52)));send.setOnClickListener(v->{String body=e.getText().toString().trim();if(body.isEmpty())return;JsonObject b=new JsonObject();b.addProperty("author_id",userId);b.addProperty("body",body);supabase.request("POST","/rest/v1/posts",b.toString(),new SupabaseClient.Callback(){public void onSuccess(String s){e.setText("");toast("Пост опубликован");showProfile();}public void onError(Exception x){toast("Не удалось опубликовать пост");}});});return box;}\n'''
            text = text.replace(marker, helpers + marker)
        def postsAnchor = 'section("Посты");loadPosts(profileId);}'
        def postsReplacement = 'section("Посты");if(own)content.addView(postComposer());loadPosts(profileId);}'
        if (text.contains(postsAnchor)) text = text.replace(postsAnchor, postsReplacement)

        if (!text.contains('private void rememberPlayed(JsonObject t){')) {
            def marker = '    private void incrementPlay(JsonObject t){'
            def helper = '''    private void rememberPlayed(JsonObject t){try{JsonArray a=JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("play_history_json","[]")).getAsJsonArray();JsonObject x=t.deepCopy();x.addProperty("played_at",System.currentTimeMillis());for(int i=a.size()-1;i>=0;i--)if(val(a.get(i).getAsJsonObject(),"id").equals(val(t,"id")))a.remove(i);a.add(0,x);while(a.size()>30)a.remove(a.size()-1);getPreferences(MODE_PRIVATE).edit().putString("play_history_json",a.toString()).apply();}catch(Exception ignored){}}\n'''
            text = text.replace(marker, helper + marker)
        text = text.replace('showMini(val(t,"title"));incrementPlay(t);', 'showMini(val(t,"title"));rememberPlayed(t);incrementPlay(t);')

        source.setText(text, 'UTF-8')
    }
}

tasks.named('preBuild') { dependsOn 'prepareNexora170' }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}