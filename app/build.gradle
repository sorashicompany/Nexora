plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.music'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.nexora.music'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'SUPABASE_URL', '"https://xvmcsqpfcabhblaweaix.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_BRUOkhD4ZFOQyLm5y0-HQg_LoDVyMND"'
        buildConfigField 'String', 'NEXORA_API_URL', '"https://nexora-api.sorashithegod.workers.dev"'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareNexoraLogo') {
    def source = file('nexora_logo.webp.b64')
    def output = file('src/main/res/drawable-nodpi/nexora_logo.webp')
    outputs.file(output)
    doLast {
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.decoder.decode(source.text.replaceAll(/\s+/, ''))
    }
}

tasks.named('preBuild') { dependsOn 'prepareNexoraLogo' }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}
