plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.music'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.nexora.music'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '1.5.1'
        buildConfigField 'String', 'SUPABASE_URL', '"https://xvmcsqpfcabhblaweaix.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_BRUOkhD4ZFOQyLm5y0-HQg_LoDVyMND"'
        buildConfigField 'String', 'NEXORA_API_URL', '"https://nexora-api.sorashithegod.workers.dev"'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Temporary source preparation kept deterministic: every build starts from the committed Java source.
tasks.register('prepareNexora151') {
    doLast {
        def source = file('src/main/java/com/nexora/music/MainActivity.java')
        def text = source.getText('UTF-8')
        text = text.replace('v1.4.1', 'v1.5.1').replace('v1.5.0', 'v1.5.1')

        // Liked music is intentionally not a primary destination in the bottom navigation.
        def oldNav = '''    private LinearLayout buildNav(int selected){LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(6),dp(5),dp(6),dp(5));n.setBackground(round(SURFACE,26));n.addView(navItem("Поиск",R.drawable.ic_search,selected==-2,v->showSearch()),weight());n.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());n.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());n.addView(navItem("Музыка",android.R.drawable.btn_star_big_on,selected==4,v->showLikedMusic()),weight());n.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());n.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());return n;}'''
        def newNav = '''    private LinearLayout buildNav(int selected){LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(8),dp(5),dp(8),dp(5));n.setBackground(round(SURFACE,26));n.addView(navItem("Поиск",R.drawable.ic_search,selected==-2,v->showSearch()),weight());n.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());n.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());n.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());n.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());return n;}'''
        if (text.contains(oldNav)) text = text.replace(oldNav, newNav)

        if (!text.contains('private void showLikedMusic(){')) {
            def marker = '    private void showChats(){'
            def liked = '''    private void showLikedMusic(){shell("Понравившееся",-1);TextView intro=txt("Твоя музыка",13,MUTED,false);content.addView(intro);LinearLayout list= new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);content.addView(list);String raw=getPreferences(MODE_PRIVATE).getString("liked_music_json","[]");try{JsonArray a=JsonParser.parseString(raw).getAsJsonArray();if(a.size()==0){list.addView(empty("Здесь пока пусто","Нажимай ★ на треках, которые хочешь сохранить."));}else for(JsonElement e:a)list.addView(trackCard(e.getAsJsonObject(),false));}catch(Exception e){list.addView(empty("Не удалось открыть музыку","Попробуй ещё раз."));}}\n    private boolean isLiked(JsonObject t){String id=val(t,"id"),url=val(t,"audio_url");try{for(JsonElement e:JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("liked_music_json","[]")).getAsJsonArray()){JsonObject x=e.getAsJsonObject();if((!id.isEmpty()&&id.equals(val(x,"id")))||(!url.isEmpty()&&url.equals(val(x,"audio_url"))))return true;}}catch(Exception ignored){}return false;}\n    private void toggleLiked(JsonObject t){try{JsonArray a=JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("liked_music_json","[]")).getAsJsonArray();String id=val(t,"id"),url=val(t,"audio_url");int found=-1;for(int i=0;i<a.size();i++){JsonObject x=a.get(i).getAsJsonObject();if((!id.isEmpty()&&id.equals(val(x,"id")))||(!url.isEmpty()&&url.equals(val(x,"audio_url")))){found=i;break;}}if(found>=0){a.remove(found);toast("Убрано из понравившегося");}else{a.add(t.deepCopy());toast("Добавлено в понравившееся");}getPreferences(MODE_PRIVATE).edit().putString("liked_music_json",a.toString()).apply();}catch(Exception e){toast("Не удалось изменить понравившееся");}}\n'''
            text = text.replace(marker, liked + marker)
        }

        // Compact, attractive entry inside the profile: favorite music becomes part of the creator's identity.
        if (!text.contains('private View likedMusicProfileCard(){')) {
            def marker = '    private void renderProfile(JsonObject p,boolean own,String profileId){'
            def helper = '''    private View likedMusicProfileCard(){LinearLayout r=card();r.setOrientation(LinearLayout.VERTICAL);r.setPadding(dp(15),dp(13),dp(15),dp(13));LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);TextView star=txt("★",22,CYAN,true);star.setGravity(Gravity.CENTER);star.setBackground(round(SURFACE2,16));top.addView(star,new LinearLayout.LayoutParams(dp(46),dp(46)));LinearLayout copy=new LinearLayout(this);copy.setOrientation(LinearLayout.VERTICAL);copy.setPadding(dp(12),0,dp(8),0);copy.addView(txt("Понравившаяся музыка",15,TEXT,true));int count=0;try{count=JsonParser.parseString(getPreferences(MODE_PRIVATE).getString("liked_music_json","[]")).getAsJsonArray().size();}catch(Exception ignored){}copy.addView(txt(count==0?"Сохраняй любимые треки одним нажатием":""+count+" сохранённых композиций",11,MUTED,false));top.addView(copy,new LinearLayout.LayoutParams(0,-2,1));TextView arrow=txt("›",25,MUTED,true);top.addView(arrow,new LinearLayout.LayoutParams(dp(32),dp(46)));r.addView(top);r.setOnClickListener(v->showLikedMusic());r.setOnTouchListener((v,e)->{if(e.getAction()==MotionEvent.ACTION_DOWN)v.animate().scaleX(.985f).scaleY(.985f).setDuration(70).start();else if(e.getAction()==MotionEvent.ACTION_UP)v.animate().scaleX(1).scaleY(1).setDuration(120).start();return false;});return r;}\n'''
            text = text.replace(marker, helper + marker)
        }

        def profileAnchor = 'content.addView(hero);stats(profileId);section("Сервисы");loadServices(profileId);section("Треки");loadTracks(profileId,own,"track");section("Биты");loadTracks(profileId,own,"beat");section("Посты");loadPosts(profileId);}'
        def profileReplacement = 'content.addView(hero);stats(profileId);section("Сервисы");loadServices(profileId);section("Музыка");content.addView(likedMusicProfileCard());section("Треки");loadTracks(profileId,own,"track");section("Биты");loadTracks(profileId,own,"beat");section("Посты");loadPosts(profileId);}'
        if (text.contains(profileAnchor)) text = text.replace(profileAnchor, profileReplacement)

        source.setText(text, 'UTF-8')
    }
}

tasks.named('preBuild') { dependsOn 'prepareNexora151' }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}