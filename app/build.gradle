plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.music'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.nexora.music'
        minSdk 23
        targetSdk 35
        versionCode 22
        versionName '1.8.0'
        buildConfigField 'String', 'SUPABASE_URL', '"https://xvmcsqpfcabhblaweaix.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_BRUOkhD4ZFOQyLm5y0-HQg_LoDVyMND"'
        buildConfigField 'String', 'NEXORA_API_URL', '"https://nexora-api.sorashithegod.workers.dev"'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Small, deterministic UI migration. The application source stays feature-focused;
// this task only applies the visual system so repeated builds remain idempotent.
tasks.register('prepareNexora180') {
    doLast {
        def source = file('src/main/java/com/nexora/music/MainActivity.java')
        def text = source.getText('UTF-8')
        text = text.replace('v1.4.1', 'v1.8.0').replace('v1.7.0', 'v1.8.0')

        def oldShell = '''    private void shell(String title,int selected){LinearLayout root=base();LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);top.setPadding(dp(14),0,dp(14),0);ImageView logo=new ImageView(this);logo.setImageResource(R.drawable.nexora_mark);logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);top.addView(logo,new LinearLayout.LayoutParams(dp(38),dp(38)));TextView h=txt(title,20,TEXT,true);h.setPadding(dp(10),0,0,0);top.addView(h,new LinearLayout.LayoutParams(0,dp(54),1));content=new LinearLayout(this);content.setOrientation(LinearLayout.VERTICAL);content.setPadding(dp(16),dp(4),dp(16),dp(16));ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);scroll.addView(content);root.addView(top,new LinearLayout.LayoutParams(-1,dp(58)));root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));miniPlayer=new LinearLayout(this);miniPlayer.setGravity(Gravity.CENTER_VERTICAL);miniPlayer.setPadding(dp(10),dp(6),dp(8),dp(6));miniPlayer.setBackground(round(SURFACE2,18));miniPlayer.setVisibility(View.GONE);miniTitle=txt("",13,TEXT,true);miniPlayer.addView(miniTitle,new LinearLayout.LayoutParams(0,dp(44),1));ImageView pp=icon(android.R.drawable.ic_media_play,CYAN);pp.setOnClickListener(v->{if(player==null)return;if(player.isPlaying())player.pause();else player.start();});miniPlayer.addView(pp,new LinearLayout.LayoutParams(dp(44),dp(44)));root.addView(miniPlayer,new LinearLayout.LayoutParams(-1,dp(56)));nav=buildNav(selected);root.addView(nav,new LinearLayout.LayoutParams(-1,dp(70)));setContentView(root);inset(root);animate(content);}'''
        def newShell = '''    private void shell(String title,int selected){LinearLayout root=base();LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);top.setPadding(dp(12),dp(5),dp(12),dp(5));top.setBackground(gradient(dark?Color.rgb(7,12,22):LIGHT,dark?Color.rgb(10,17,30):Color.WHITE,0));ImageView logo=new ImageView(this);logo.setImageResource(R.drawable.nexora_mark);logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);top.addView(logo,new LinearLayout.LayoutParams(dp(42),dp(42)));LinearLayout titleBox=new LinearLayout(this);titleBox.setOrientation(LinearLayout.VERTICAL);titleBox.setPadding(dp(10),0,0,0);TextView brand=txt("NEXORA",9,CYAN,true);brand.setLetterSpacing(.16f);titleBox.addView(brand);TextView h=txt(title,20,TEXT,true);titleBox.addView(h);top.addView(titleBox,new LinearLayout.LayoutParams(0,dp(54),1));content=new LinearLayout(this);content.setOrientation(LinearLayout.VERTICAL);content.setPadding(dp(16),dp(8),dp(16),dp(18));ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);scroll.setClipToPadding(false);scroll.addView(content);root.addView(top,new LinearLayout.LayoutParams(-1,dp(64)));root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));miniPlayer=new LinearLayout(this);miniPlayer.setGravity(Gravity.CENTER_VERTICAL);miniPlayer.setPadding(dp(10),dp(6),dp(8),dp(6));miniPlayer.setBackground(gradient(SURFACE2,Color.rgb(28,40,57),18));miniPlayer.setElevation(dp(5));miniPlayer.setVisibility(View.GONE);miniTitle=txt("",13,TEXT,true);miniPlayer.addView(miniTitle,new LinearLayout.LayoutParams(0,dp(44),1));ImageView pp=icon(R.drawable.ic_play,CYAN);pp.setBackground(round(Color.argb(38,51,210,238),20));pp.setOnClickListener(v->{if(player==null)return;if(player.isPlaying())player.pause();else player.start();});miniPlayer.addView(pp,new LinearLayout.LayoutParams(dp(44),dp(44)));root.addView(miniPlayer,new LinearLayout.LayoutParams(-1,dp(58)));nav=buildNav(selected);root.addView(nav,new LinearLayout.LayoutParams(-1,dp(74)));setContentView(root);inset(root);animate(content);}'''
        if (text.contains(oldShell)) text=text.replace(oldShell,newShell)

        def oldNav = '''    private LinearLayout buildNav(int selected){LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(8),dp(5),dp(8),dp(5));n.setBackground(round(SURFACE,26));n.addView(navItem("Поиск",R.drawable.ic_search,selected==-2,v->showSearch()),weight());n.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());n.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());n.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());n.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());return n;}'''
        def newNav = '''    private LinearLayout buildNav(int selected){LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(7),dp(6),dp(7),dp(6));n.setBackground(gradient(SURFACE,Color.rgb(20,30,44),27));n.setElevation(dp(7));n.addView(navItem("Поиск",R.drawable.ic_search,selected==-2,v->showSearch()),weight());n.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());n.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());n.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());n.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());return n;}'''
        if (text.contains(oldNav)) text=text.replace(oldNav,newNav)

        def oldNavItem = '''    private View navItem(String title,int res,boolean selected,View.OnClickListener listener){LinearLayout b=new LinearLayout(this);b.setOrientation(LinearLayout.VERTICAL);b.setGravity(Gravity.CENTER);ImageView i=icon(res,selected?CYAN:MUTED);TextView t=txt(title,9,selected?TEXT:MUTED,selected);t.setGravity(Gravity.CENTER);b.addView(i,new LinearLayout.LayoutParams(-1,dp(30)));b.addView(t);b.setOnClickListener(v->{v.animate().scaleX(.92f).scaleY(.92f).setDuration(55).withEndAction(()->v.animate().scaleX(1).scaleY(1).setDuration(100).start()).start();listener.onClick(v);});return b;}'''
        def newNavItem = '''    private View navItem(String title,int res,boolean selected,View.OnClickListener listener){LinearLayout b=new LinearLayout(this);b.setOrientation(LinearLayout.VERTICAL);b.setGravity(Gravity.CENTER);b.setPadding(dp(3),dp(3),dp(3),dp(3));if(selected){GradientDrawable active=round(Color.argb(30,51,210,238),17);active.setStroke(dp(1),Color.argb(75,51,210,238));b.setBackground(active);}ImageView i=icon(res,selected?CYAN:MUTED);TextView t=txt(title,9,selected?TEXT:MUTED,selected);t.setGravity(Gravity.CENTER);b.addView(i,new LinearLayout.LayoutParams(-1,dp(28)));b.addView(t,new LinearLayout.LayoutParams(-1,dp(18)));b.setOnClickListener(v->{v.animate().scaleX(.91f).scaleY(.91f).setDuration(60).withEndAction(()->v.animate().scaleX(1).scaleY(1).setDuration(120).start()).start();listener.onClick(v);});return b;}'''
        if (text.contains(oldNavItem)) text=text.replace(oldNavItem,newNavItem)

        def oldCard = '''    private LinearLayout card(){LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.HORIZONTAL);r.setBackground(round(SURFACE,20));return r;}'''
        def newCard = '''    private LinearLayout card(){LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.HORIZONTAL);GradientDrawable bg=gradient(SURFACE,SURFACE2,22);bg.setStroke(dp(1),Color.argb(45,90,120,160));r.setBackground(bg);r.setElevation(dp(2));r.setClipToOutline(true);return r;}'''
        if (text.contains(oldCard)) text=text.replace(oldCard,newCard)

        def oldBase = '''    private LinearLayout base(){LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setBackgroundColor(dark?BG:LIGHT);return r;}'''
        def newBase = '''    private LinearLayout base(){LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setBackground(gradient(dark?Color.rgb(4,8,18):LIGHT,dark?Color.rgb(9,16,29):Color.WHITE,0));return r;}'''
        if (text.contains(oldBase)) text=text.replace(oldBase,newBase)

        def oldTxt = '''    private TextView txt(String s,int size,int color,boolean isBold){TextView t=new TextView(this);t.setText(s==null?"":s);t.setTextSize(size);t.setTextColor(dark?color:(color==TEXT?Color.rgb(20,27,35):color));t.setTypeface(isBold?bold:regular);return t;}'''
        def newTxt = '''    private TextView txt(String s,int size,int color,boolean isBold){TextView t=new TextView(this);t.setText(s==null?"":s);t.setTextSize(size);t.setTextColor(dark?color:(color==TEXT?Color.rgb(20,27,35):color));t.setTypeface(isBold?bold:regular);t.setIncludeFontPadding(false);t.setLetterSpacing(isBold?.012f:0f);return t;}'''
        if (text.contains(oldTxt)) text=text.replace(oldTxt,newTxt)

        def oldInput = '''    private EditText input(String hint){EditText e=new EditText(this);e.setSingleLine(true);e.setHint(hint);e.setHintTextColor(MUTED);e.setTextColor(dark?TEXT:Color.rgb(20,27,35));e.setTextSize(14);e.setPadding(dp(15),0,dp(15),0);e.setBackground(round(dark?SURFACE2:Color.WHITE,22));return e;}'''
        def newInput = '''    private EditText input(String hint){EditText e=new EditText(this);e.setSingleLine(true);e.setHint(hint);e.setHintTextColor(MUTED);e.setTextColor(dark?TEXT:Color.rgb(20,27,35));e.setTextSize(14);e.setPadding(dp(15),0,dp(15),0);GradientDrawable bg=round(dark?Color.rgb(20,29,42):Color.WHITE,22);bg.setStroke(dp(1),Color.argb(55,51,210,238));e.setBackground(bg);e.setSelectAllOnFocus(false);return e;}'''
        if (text.contains(oldInput)) text=text.replace(oldInput,newInput)

        def oldButton = '''    private Button button(String label,int color){Button b=new Button(this);b.setText(label);b.setTextColor(TEXT);b.setTextSize(13);b.setAllCaps(false);b.setStateListAnimator(null);b.setBackground(round(color,20));return b;}'''
        def newButton = '''    private Button button(String label,int color){Button b=new Button(this);b.setText(label);b.setTextColor(color==CYAN||color==VIOLET||color==BLUE?BG:TEXT);b.setTextSize(13);b.setAllCaps(false);b.setStateListAnimator(null);b.setGravity(Gravity.CENTER);GradientDrawable bg;if(color==CYAN)bg=gradient(CYAN,BLUE,20);else if(color==VIOLET)bg=gradient(VIOLET,Color.rgb(95,75,220),20);else bg=round(color,20);if(color==SURFACE2){bg.setStroke(dp(1),Color.argb(55,100,125,160));}b.setBackground(bg);b.setPadding(dp(10),0,dp(10),0);b.setOnTouchListener((v,e)->{if(e.getAction()==MotionEvent.ACTION_DOWN)v.animate().scaleX(.985f).scaleY(.985f).setDuration(55).start();else if(e.getAction()==MotionEvent.ACTION_UP||e.getAction()==MotionEvent.ACTION_CANCEL)v.animate().scaleX(1).scaleY(1).setDuration(110).start();return false;});return b;}'''
        if (text.contains(oldButton)) text=text.replace(oldButton,newButton)

        def oldAvatar = '''    private TextView avatar(String name){TextView a=txt(initial(name),19,TEXT,true);a.setGravity(Gravity.CENTER);a.setBackground(round(BLUE,50));return a;}'''
        def newAvatar = '''    private TextView avatar(String name){TextView a=txt(initial(name),19,TEXT,true);a.setGravity(Gravity.CENTER);GradientDrawable bg=gradient(BLUE,VIOLET,50);bg.setStroke(dp(1),Color.argb(80,160,170,255));a.setBackground(bg);a.setElevation(dp(2));return a;}'''
        if (text.contains(oldAvatar)) text=text.replace(oldAvatar,newAvatar)

        def oldSection = '''    private void section(String s){TextView t=txt(s,21,TEXT,true);t.setPadding(0,dp(16),0,dp(8));content.addView(t);}'''
        def newSection = '''    private void section(String s){LinearLayout head=new LinearLayout(this);head.setGravity(Gravity.CENTER_VERTICAL);View line=new View(this);line.setBackground(round(Color.argb(120,51,210,238),2));head.addView(line,new LinearLayout.LayoutParams(dp(3),dp(20)));TextView t=txt(s,19,TEXT,true);t.setPadding(dp(9),dp(16),0,dp(8));head.addView(t,new LinearLayout.LayoutParams(-1,-2));content.addView(head);}'''
        if (text.contains(oldSection)) text=text.replace(oldSection,newSection)

        def oldSettingRow = '''    private LinearLayout settingRow(String title,String sub){LinearLayout r=card();r.setGravity(Gravity.CENTER_VERTICAL);r.setPadding(dp(14),dp(12),dp(10),dp(12));LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.addView(txt(title,15,TEXT,true));c.addView(txt(sub,11,MUTED,false));r.addView(c,new LinearLayout.LayoutParams(0,-2,1));r.addView(txt("›",22,MUTED,true));margin(r,0,0,0,7);return r;}'''
        def newSettingRow = '''    private LinearLayout settingRow(String title,String sub){LinearLayout r=card();r.setGravity(Gravity.CENTER_VERTICAL);r.setPadding(dp(15),dp(13),dp(11),dp(13));LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.addView(txt(title,15,TEXT,true));TextView d=txt(sub,11,MUTED,false);d.setPadding(0,dp(4),0,0);c.addView(d);r.addView(c,new LinearLayout.LayoutParams(0,-2,1));TextView arrow=txt("›",24,CYAN,true);arrow.setGravity(Gravity.CENTER);r.addView(arrow,new LinearLayout.LayoutParams(dp(34),dp(42)));r.setOnTouchListener((v,e)->{if(e.getAction()==MotionEvent.ACTION_DOWN)v.animate().translationX(dp(2)).setDuration(60).start();else if(e.getAction()==MotionEvent.ACTION_UP||e.getAction()==MotionEvent.ACTION_CANCEL)v.animate().translationX(0).setDuration(120).start();return false;});margin(r,0,0,0,8);return r;}'''
        if (text.contains(oldSettingRow)) text=text.replace(oldSettingRow,newSettingRow)

        def oldRound = '''    private GradientDrawable round(int color,int radius){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(dp(radius));return g;}'''
        def newRound = '''    private GradientDrawable round(int color,int radius){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(dp(radius));return g;}\n    private GradientDrawable gradient(int start,int end,int radius){GradientDrawable g=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{start,end});g.setCornerRadius(dp(radius));return g;}'''
        if (text.contains(oldRound)) text=text.replace(oldRound,newRound)

        source.setText(text, 'UTF-8')
    }
}

tasks.named('preBuild') { dependsOn 'prepareNexora180' }

