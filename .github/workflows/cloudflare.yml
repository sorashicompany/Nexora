name: Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/cloudflare/**"
      - ".github/workflows/cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Nexora API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker files
        working-directory: server/cloudflare
        run: |
          test -f worker.js
          test -f wrangler.toml
          grep -q '^name = "nexora-api"' wrangler.toml

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/cloudflare
          command: deploy
