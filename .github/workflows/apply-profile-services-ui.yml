name: Apply profile roles and services UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-profile-services-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Android profile settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nexora/music/MainActivity.java')
          s = p.read_text()
          if 'private void showProfileRoles()' in s:
              print('Profile/services patch already applied')
              raise SystemExit(0)

          s = s.replace('import android.widget.Button;\n', 'import android.widget.Button;\nimport android.widget.CheckBox;\n')

          old = '''    private void showSettings(){showShell("Настройки",2);TextView kicker=text("NEXORA • STUDIO",11,CYAN,true);kicker.setPadding(0,dp(8),0,dp(2));content.addView(kicker);sectionTitle("Настройки");content.addView(setting("Воспроизведение","Автовоспроизведение превью","ON"));content.addView(setting("Качество аудио","Высокое качество","›"));content.addView(setting("Уведомления","Сообщения и новые релизы","ON"));content.addView(setting("Приватность","Контроль видимости профиля","›"));content.addView(setting("Сервисы","Telegram используется для входа","✓"));content.addView(spacer(12));Button out=button("Выйти из аккаунта",Color.rgb(65,28,40));out.setTextColor(Color.rgb(255,110,130));out.setOnClickListener(v->{supabase.signOut();getPreferences(MODE_PRIVATE).edit().putBoolean("welcome_seen",false).apply();showWelcome();});content.addView(out,new LinearLayout.LayoutParams(-1,dp(50)));}'''

          new = '''    private void showSettings(){showShell("Настройки",2);TextView kicker=text("NEXORA • STUDIO",11,CYAN,true);kicker.setPadding(0,dp(8),0,dp(2));content.addView(kicker);sectionTitle("Настройки");content.addView(setting("Воспроизведение","Автовоспроизведение превью","ON"));content.addView(setting("Качество аудио","Высокое качество","›"));content.addView(setting("Уведомления","Сообщения и новые релизы","ON"));content.addView(setting("Приватность","Контроль видимости профиля","›"));Button roles=button("Тип профиля",SURFACE_2);roles.setGravity(Gravity.CENTER_VERTICAL);roles.setOnClickListener(v->showProfileRoles());content.addView(roles,new LinearLayout.LayoutParams(-1,dp(52)));content.addView(spacer(8));Button services=button("Музыкальные сервисы",SURFACE_2);services.setGravity(Gravity.CENTER_VERTICAL);services.setOnClickListener(v->showServiceManager());content.addView(services,new LinearLayout.LayoutParams(-1,dp(52)));content.addView(spacer(8));content.addView(setting("Сервисы","Telegram используется для входа","✓"));content.addView(spacer(12));Button out=button("Выйти из аккаунта",Color.rgb(65,28,40));out.setTextColor(Color.rgb(255,110,130));out.setOnClickListener(v->{supabase.signOut();getPreferences(MODE_PRIVATE).edit().putBoolean("welcome_seen",false).apply();showWelcome();});content.addView(out,new LinearLayout.LayoutParams(-1,dp(50)));}'''

          if old not in s:
              raise SystemExit('showSettings target not found')
          s = s.replace(old, new, 1)

          marker = '    private void showProfile(){'
          methods = r'''    private void showProfileRoles(){
        LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(dp(8),dp(4),dp(8),dp(4));
        CheckBox artist=new CheckBox(this);artist.setText("Исполнитель");artist.setTextColor(TEXT);artist.setTextSize(16);box.addView(artist);
        CheckBox beatmaker=new CheckBox(this);beatmaker.setText("Битмейкер");beatmaker.setTextColor(TEXT);beatmaker.setTextSize(16);box.addView(beatmaker);
        supabase.request("GET","/rest/v1/profiles?select=is_artist,is_beatmaker&id=eq."+userId,null,new SupabaseClient.Callback(){public void onSuccess(String r){runOnUiThread(()->{try{JsonArray a=JsonParser.parseString(r).getAsJsonArray();if(a.size()>0){JsonObject p=a.get(0).getAsJsonObject();artist.setChecked(p.has("is_artist")&&p.get("is_artist").getAsBoolean());beatmaker.setChecked(p.has("is_beatmaker")&&p.get("is_beatmaker").getAsBoolean());}}catch(Exception ignored){}});}public void onError(Exception e){}});
        new AlertDialog.Builder(this).setTitle("Тип профиля").setMessage("Можно выбрать оба типа. Если оба отключены, аккаунт остаётся обычным пользователем; этот статус не показывается в профиле.").setView(box).setNegativeButton("Отмена",null).setPositiveButton("Сохранить",(d,w)->saveProfileRoles(artist.isChecked(),beatmaker.isChecked())).show();
    }
    private void saveProfileRoles(boolean artist,boolean beatmaker){JsonObject b=new JsonObject();b.addProperty("is_artist",artist);b.addProperty("is_beatmaker",beatmaker);supabase.request("PATCH","/rest/v1/profiles?id=eq."+userId,b.toString(),new SupabaseClient.Callback(){public void onSuccess(String r){toast("Тип профиля сохранён");}public void onError(Exception e){toast("Не удалось сохранить тип профиля");}});}

    private void showServiceManager(){
        String[] names={"SoundCloud","Spotify","Яндекс Музыка","BeatChain"};String[] platforms={"soundcloud","spotify","yandex_music","beatchain"};
        LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(dp(4),0,dp(4),0);
        for(int i=0;i<names.length;i++){final int idx=i;Button row=button(names[i],SURFACE_2);row.setGravity(Gravity.CENTER_VERTICAL);box.addView(row,new LinearLayout.LayoutParams(-1,dp(50)));LinearLayout.LayoutParams rp=(LinearLayout.LayoutParams)row.getLayoutParams();rp.setMargins(0,dp(6),0,0);row.setLayoutParams(rp);row.setOnClickListener(v->editServiceLink(names[idx],platforms[idx]));}
        new AlertDialog.Builder(this).setTitle("Музыкальные сервисы").setMessage("Добавляй только публичные ссылки. Nexora не запрашивает пароли и OAuth-доступ.").setView(box).setNegativeButton("Закрыть",null).show();
    }
    private void editServiceLink(String name,String platform){
        EditText input=input("https://...");
        supabase.request("GET","/rest/v1/social_links?select=id,url&profile_id=eq."+userId+"&platform=eq."+platform+"&limit=1",null,new SupabaseClient.Callback(){public void onSuccess(String r){runOnUiThread(()->{try{JsonArray a=JsonParser.parseString(r).getAsJsonArray();if(a.size()>0)input.setText(a.get(0).getAsJsonObject().get("url").getAsString());}catch(Exception ignored){}});}public void onError(Exception e){}});
        new AlertDialog.Builder(this).setTitle(name).setView(input).setNegativeButton("Удалить",(d,w)->deleteService(platform)).setNeutralButton("Отмена",null).setPositiveButton("Сохранить",(d,w)->saveService(platform,input.getText().toString().trim())).show();
    }
    private boolean validServiceUrl(String platform,String url){try{Uri u=Uri.parse(url);String h=u.getHost()==null?"":u.getHost().toLowerCase();if(!"https".equalsIgnoreCase(u.getScheme()))return false;if("soundcloud".equals(platform))return h.equals("soundcloud.com")||h.endsWith(".soundcloud.com");if("spotify".equals(platform))return h.equals("open.spotify.com")||h.equals("spotify.com")||h.endsWith(".spotify.com");if("yandex_music".equals(platform))return h.equals("music.yandex.ru")||h.endsWith(".music.yandex.ru");if("beatchain".equals(platform))return h.equals("beatchain.com")||h.endsWith(".beatchain.com");}catch(Exception ignored){}return false;}
    private void saveService(String platform,String url){if(!validServiceUrl(platform,url)){toast("Неверная ссылка для выбранного сервиса");return;}JsonObject b=new JsonObject();b.addProperty("profile_id",userId);b.addProperty("platform",platform);b.addProperty("url",url);supabase.request("POST","/rest/v1/social_links?on_conflict=profile_id,platform",b.toString(),new SupabaseClient.Callback(){public void onSuccess(String r){toast("Сервис привязан");}public void onError(Exception e){toast("Не удалось сохранить сервис");}});}
    private void deleteService(String platform){supabase.request("DELETE","/rest/v1/social_links?profile_id=eq."+userId+"&platform=eq."+platform,null,new SupabaseClient.Callback(){public void onSuccess(String r){toast("Сервис удалён");}public void onError(Exception e){toast("Не удалось удалить сервис");}});}

'''
          if marker not in s:
              raise SystemExit('showProfile marker not found')
          s=s.replace(marker, methods+marker, 1)
          p.write_text(s)
          PY

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nexora/music/MainActivity.java
          git commit -m 'feat(android): add profile roles and music service manager [skip ci]'
          git push
