name: Nexora UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[ui-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Android UI
        run: |
          python3 .github/scripts/patch_ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nexora/music/MainActivity.java
          git diff --cached --quiet || git commit -m 'fix(android): refine search favorites settings and insets [ui-patch]'
          git push
