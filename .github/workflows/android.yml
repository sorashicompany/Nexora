name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Replace legacy Unicode UI icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nexora/music/MainActivity.java')
          s = p.read_text()
          s = s.replace('TextView prof=text("●",21,ACCENT,true);prof.setGravity(Gravity.CENTER);prof.setOnClickListener(v->showProfile());top.addView(prof,new LinearLayout.LayoutParams(dp(44),dp(44)));', 'ImageView prof=icon(R.drawable.ic_profile,ACCENT);prof.setOnClickListener(v->showProfile());top.addView(prof,new LinearLayout.LayoutParams(dp(44),dp(44)));')
          s = s.replace('nav.addView(navItem("Чаты","▣",selected==0,v->showChats()),weight());nav.addView(navItem("Друзья","♙",selected==1,v->showFriends()),weight());nav.addView(navItem("Настройки","⚙",selected==2,v->showSettings()),weight());nav.addView(navItem("Профиль","●",selected==3,v->showProfile()),weight());', 'nav.addView(navItem("Чаты",R.drawable.ic_chat,selected==0,v->showChats()),weight());nav.addView(navItem("Друзья",R.drawable.ic_people,selected==1,v->showFriends()),weight());nav.addView(navItem("Настройки",R.drawable.ic_settings,selected==2,v->showSettings()),weight());nav.addView(navItem("Профиль",R.drawable.ic_profile,selected==3,v->showProfile()),weight());')
          s = s.replace('private View navItem(String title,String icon,boolean selected,View.OnClickListener l){', 'private View navItem(String title,int iconRes,boolean selected,View.OnClickListener l){')
          s = s.replace('TextView i=text(icon,20,selected?ACCENT:TEXT,true);i.setGravity(Gravity.CENTER);TextView t=', 'ImageView i=icon(iconRes,selected?ACCENT:TEXT);TextView t=')
          s = s.replace('TextView send=text("➤",22,ACCENT,true);send.setGravity(Gravity.CENTER);', 'ImageView send=icon(R.drawable.ic_send,ACCENT);')
          s = s.replace('Button chat=small("▣",CYAN);', 'Button chat=small("",CYAN);')
          s = s.replace('Button more=small("⋯",MUTED);', 'Button more=small("",MUTED);')
          p.write_text(s)
          PY

      - name: Apply profile role and public service fixes
        run: python3 scripts/patch_android_ui.py

      - name: Repair duplicate Java helpers and use new action icons
        run: |
          python3 scripts/repair_java_duplicates.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/nexora/music/MainActivity.java')
          s=p.read_text()
          s=s.replace('Button chat=small("",CYAN);chat.setOnClickListener(v->createChat(id));', 'ImageView chat=icon(R.drawable.ic_chat,CYAN);chat.setOnClickListener(v->createChat(id));')
          s=s.replace('Button more=small("",MUTED);more.setOnClickListener(v->friendMenu(id,friendshipId));', 'ImageView more=icon(R.drawable.ic_more,MUTED);more.setOnClickListener(v->friendMenu(id,friendshipId));')
          s=s.replace('private void splash(){', 'private void splash(){')
          p.write_text(s)
          PY

      - name: Persist source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/com/nexora/music/MainActivity.java; then
            git add app/src/main/java/com/nexora/music/MainActivity.java
            git commit -m "fix(android): complete profile roles and public music services"
            git push
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Persist Gradle-applied UI and version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/com/nexora/music/MainActivity.java; then
            git add app/src/main/java/com/nexora/music/MainActivity.java
            git commit -m "feat(android): persist Nexora 1.2.0 settings UI"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
