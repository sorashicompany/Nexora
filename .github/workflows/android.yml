name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Apply Android UI and Settings patch
        run: |
          python3 scripts/patch_android_ui.py
          python3 scripts/ensure_settings.py
          python3 scripts/ensure_settings_state.py

      - name: Build Nexora 1.9.1
        run: ./gradlew --no-daemon assembleDebug

      - name: Persist generated Android source
        run: |
          if git diff --quiet -- app/src/main/java/com/nexora/music/MainActivity.java; then
            echo "No generated source changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nexora/music/MainActivity.java
          git commit -m "Fix and complete Settings implementation [skip ci]"
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-v1.9.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
