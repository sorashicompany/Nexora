name: Build Nexora APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Live app URL for WebView (e.g. https://nexora.vercel.app)'
        required: false
        type: string

permissions:
  contents: read

env:
  NEXORA_CAPACITOR: "1"
  # Prefer manual dispatch input, then repo variable, then secret
  CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.CAPACITOR_SERVER_URL || secrets.CAPACITOR_SERVER_URL }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app (SPA shell for Capacitor assets)
        run: npm run build:dev

      - name: Stage web assets for Capacitor
        run: node scripts/stage-capacitor.mjs

      - name: Inject live-server bridge into index.html
        run: node scripts/inject-capacitor-bridge.mjs

      - name: Verify Capacitor web entry
        run: |
          test -s dist/index.html
          grep -qi '<html' dist/index.html
          echo "CAPACITOR_SERVER_URL=${CAPACITOR_SERVER_URL:-<empty>}"

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present"
          fi

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
