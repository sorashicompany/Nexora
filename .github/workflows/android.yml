name: Build Nexora APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: Build web app
        run: npm run build:dev

      - name: Stage web assets for Capacitor
        run: |
          set -e
          rm -rf dist
          index_file="$(find . -path './node_modules' -prune -o -path './android' -prune -o -name index.html -print -quit)"
          if [ -z "$index_file" ]; then
            echo 'No index.html found after build'
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi
          web_root="$(dirname "$index_file")"
          echo "Using web assets from: $web_root"
          mkdir -p dist
          cp -a "$web_root"/. dist/
          test -f dist/index.html

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.nexora.app',
            appName: 'Nexora',
            webDir: 'dist',
            bundledWebRuntime: false,
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
