name: Build Nexora APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXORA_CAPACITOR: "1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build:dev

      - name: Stage web assets for Capacitor
        run: node scripts/stage-capacitor.mjs

      - name: Verify Capacitor web entry
        run: |
          test -s dist/index.html
          grep -qi '<html' dist/index.html
          grep -q '<script' dist/index.html
          if grep -q '<div id="root"></div>' dist/index.html; then
            echo 'ERROR: Refusing incompatible synthetic React root shell.'
            exit 1
          fi

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already present"
          fi

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Verify Android web entry
        run: |
          test -s android/app/src/main/assets/public/index.html
          grep -qi '<html' android/app/src/main/assets/public/index.html
          grep -q '<script' android/app/src/main/assets/public/index.html
          if grep -q '<div id="root"></div>' android/app/src/main/assets/public/index.html; then
            echo 'ERROR: Android assets contain incompatible synthetic React root shell.'
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
